[package]
name = "isacomp-core"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "isacomp_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.6", features = ["v4"] }
regex = "1"
log = "0.4"
pyo3 = { version = "0.22", features = ["extension-module"] }
pyo3-log = "0.11"
