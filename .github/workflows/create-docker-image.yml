name: "Create Docker Image and Build Cache"
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docker-image:
    name: Publish Docker Image
    strategy:
      matrix:
        include:
          - platform: amd64
            os: ubuntu-latest
          - platform: arm64
            os: ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    outputs:
      repo-name: ${{ steps.get-repo-name.outputs.REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in to the Container registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Repository Name for GitHub Actions
        id: get-repo-name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ steps.get-repo-name.outputs.REPO }}
          tags: |
            type=raw,value=latest-${{ matrix.platform }},enable={{is_default_branch}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.get-repo-name.outputs.REPO }}:build-cache-${{ matrix.platform }}
          cache-to: type=registry,ref=ghcr.io/${{ steps.get-repo-name.outputs.REPO }}:build-cache-${{ matrix.platform }},mode=max
  stitch-image:
    runs-on: ubuntu-latest
    needs: publish-docker-image
    permissions: 
       packages: write
    steps:
     - name: Log in to the Container registry
       uses: docker/login-action@v4.2.0
       with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
     - name: stitch-together
       env:
          REPO: ${{ needs.publish-docker-image.outputs.repo-name }}
       run: |
          docker buildx imagetools create \
            --tag ghcr.io/$REPO:latest \
            ghcr.io/$REPO:latest-amd64 \
            ghcr.io/$REPO:latest-arm64
      
      
      
