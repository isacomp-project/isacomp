name: RISC-V, MIPS, and OpenPOWER ISA Tests

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  # Build test binaries - these can be cached
  build-tests:
    name: Build Test Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache RISC-V toolchain
        id: cache-riscv
        uses: actions/cache@v4
        with:
          path: /opt/riscv
          key: riscv-toolchain-2024.02.02

      - name: Install RISC-V toolchain
        if: steps.cache-riscv.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/riscv
          cd /tmp
          wget -q https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2024.02.02/riscv64-elf-ubuntu-22.04-gcc-nightly-2024.02.02-nightly.tar.gz
          sudo tar -xzf riscv64-elf-ubuntu-22.04-gcc-nightly-2024.02.02-nightly.tar.gz -C /opt/riscv --strip-components=1

      - name: Add toolchains to PATH
        run: echo "/opt/riscv/bin" >> $GITHUB_PATH

      - name: Install MIPS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu

      - name: Install OpenPOWER toolchain
        run: |
          sudo apt-get install -y gcc-powerpc64le-linux-gnu binutils-powerpc64le-linux-gnu

      - name: Initialize riscv-tests submodule
        run: |
          # Initialize the riscv-tests submodule (includes env with test macros)
          # isa/riscv64/riscv-tests symlinks to this via ../riscv32/riscv-tests
          git submodule update --init --recursive isa/riscv32/riscv-tests

      - name: Build RV32I tests
        run: |
          chmod +x isa/riscv32/build_riscv_tests.sh
          ./isa/riscv32/build_riscv_tests.sh

      - name: Build RV64I tests
        run: |
          chmod +x isa/riscv64/build_riscv64_tests.sh
          cd isa/riscv64 && ./build_riscv64_tests.sh

      - name: Build MIPS32 tests
        run: |
          chmod +x isa/mips32/mips-tests/build_tests.sh
          cd isa/mips32/mips-tests && ./build_tests.sh

      - name: Build OpenPOWER tests
        run: |
          chmod +x isa/openpower/power-tests/build_tests.sh
          cd isa/openpower/power-tests && ./build_tests.sh

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries
          path: |
            isa/riscv32/riscv-tests/isa/rv32ui-isacomp-*
            isa/riscv64/riscv-tests/isa/rv64ui-isacomp-*
            isa/mips32/mips-tests/isa/mips32-isacomp-*
            isa/openpower/power-tests/isa/power-isacomp-*
          retention-days: 1

  # Generate Verilog designs
  generate-designs:
    name: Generate Verilog Designs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Generate RV32I complete processor
        run: python3 isa/riscv32/generators/generate_riscv32i_complete.py

      - name: Generate RV32I pipelined processors (stall)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage pipeline with stalling..."
            python3 isa/riscv32/generators/create_rv32i_pipeline.py --stages $stages --hazard-resolution stall
          done

      - name: Generate RV32I pipelined processors (bypass)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage pipeline with bypassing..."
            python3 isa/riscv32/generators/create_rv32i_pipeline.py --stages $stages --hazard-resolution bypass
          done

      - name: Generate MIPS32 complete processor
        run: python3 isa/mips32/generators/generate_mips32_complete.py

      - name: Generate MIPS32 pipelined processors (stall)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage MIPS pipeline with stalling..."
            python3 isa/mips32/generators/create_mips32_pipeline.py --stages $stages --hazard-resolution stall
          done

      - name: Generate MIPS32 pipelined processors (bypass)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage MIPS pipeline with bypassing..."
            python3 isa/mips32/generators/create_mips32_pipeline.py --stages $stages --hazard-resolution bypass
          done

      - name: Generate RV64I complete processor
        run: python3 isa/riscv64/generators/generate_riscv64i_complete.py

      - name: Generate RV64I pipelined processors (stall)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage RV64I pipeline with stalling..."
            python3 isa/riscv64/generators/create_rv64i_pipeline.py --stages $stages --hazard-resolution stall
          done

      - name: Generate RV64I pipelined processors (bypass)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage RV64I pipeline with bypassing..."
            python3 isa/riscv64/generators/create_rv64i_pipeline.py --stages $stages --hazard-resolution bypass
          done

      - name: Generate OpenPOWER SFS pipelined processors (stall)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage OpenPOWER pipeline with stalling..."
            python3 isa/openpower/generators/create_opsfs_pipeline.py --stages $stages --hazard-resolution stall
          done

      - name: Generate OpenPOWER SFS pipelined processors (bypass)
        run: |
          for stages in 2 3 4 5; do
            echo "Generating $stages-stage OpenPOWER pipeline with bypassing..."
            python3 isa/openpower/generators/create_opsfs_pipeline.py --stages $stages --hazard-resolution bypass
          done

      - name: Upload generated Verilog
        uses: actions/upload-artifact@v4
        with:
          name: generated-verilog
          path: |
            examples/verilog/riscv32i_complete/*.v
            examples/verilog/riscv32i_complete/*.sv
            examples/verilog/riscv32i_pipelined_*stage*/*.v
            examples/verilog/riscv32i_pipelined_*stage*/*.sv
            examples/verilog/riscv32i_pipelined_*stage*/*.sh
            examples/verilog/mips32_complete/*.v
            examples/verilog/mips32_complete/*.sv
            examples/verilog/mips32_pipelined_*stage*/*.v
            examples/verilog/mips32_pipelined_*stage*/*.sv
            examples/verilog/mips32_pipelined_*stage*/*.sh
            examples/verilog/riscv64i_complete/*.v
            examples/verilog/riscv64i_complete/*.sv
            examples/verilog/riscv64i_pipelined_*stage*/*.v
            examples/verilog/riscv64i_pipelined_*stage*/*.sv
            examples/verilog/riscv64i_pipelined_*stage*/*.sh
            examples/verilog/openpower_sfs_pipelined_*stage*/*.v
            examples/verilog/openpower_sfs_pipelined_*stage*/*.sv
            examples/verilog/openpower_sfs_pipelined_*stage*/*.sh
          retention-days: 1

  # RV32I Complete Tests
  test-riscv32-complete:
    name: Test RV32I Complete
    runs-on: ubuntu-latest
    needs: [build-tests, generate-designs]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache RISC-V toolchain
        id: cache-riscv
        uses: actions/cache@v4
        with:
          path: /opt/riscv
