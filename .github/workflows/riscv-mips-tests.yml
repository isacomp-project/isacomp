        run: |
          sudo mkdir -p /opt/riscv
          cd /tmp
          wget -q https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2024.02.02/riscv64-elf-ubuntu-22.04-gcc-nightly-2024.02.02-nightly.tar.gz
          sudo tar -xzf riscv64-elf-ubuntu-22.04-gcc-nightly-2024.02.02-nightly.tar.gz -C /opt/riscv --strip-components=1

      - name: Add toolchain to PATH
        run: echo "/opt/riscv/bin" >> $GITHUB_PATH

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: isa/

      - name: Download generated Verilog
        uses: actions/download-artifact@v4
        with:
          name: generated-verilog
          path: examples/verilog/

      - name: Run RV32I complete tests
        run: |
          cd examples/verilog/riscv32i_complete
          chmod +x run_all_tests.sh
          ./run_all_tests.sh

  # RV32I Pipelined Tests (2-5 stages)
  test-riscv32-pipelined:
    name: Test RV32I Pipelined (${{ matrix.stages }}-stage)
    runs-on: ubuntu-latest
    needs: [build-tests, generate-designs]
    timeout-minutes: 15
    strategy:
      fail-fast: false
