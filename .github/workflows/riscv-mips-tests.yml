      - name: Download generated Verilog
        uses: actions/download-artifact@v4
        with:
          name: generated-verilog
          path: examples/verilog/

      - name: Run RV32I ${{ matrix.stages }}-stage pipelined tests
        run: |
          cd examples/verilog/riscv32i_pipelined_${{ matrix.stages }}stage
          chmod +x run_riscv_tests.sh
          ./run_riscv_tests.sh

